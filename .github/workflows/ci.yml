name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  ruby:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3.12', '3.4.10', '4.0.6']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Syntax and test suite
        run: |
          ruby -v
          bundle exec ruby -e 'Dir["src/lib/**/*.rb", "spec/**/*.rb", "src/bin/paygen"].each { |f| abort("Syntax failed: #{f}") unless system(RbConfig.ruby, "-c", f) }'
          bundle exec rspec
      - name: Installed gem smoke
        run: bundle exec ruby script/verify-package.rb
      - name: Independent payment acceptance
        run: bundle exec ruby script/acceptance-independent
      - name: CLI and generation smoke
        run: script/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ruby-${{ matrix.ruby }}
          path: |
            Gemfile.lock
            coverage/
            tmp/fuzz-verification/
            tmp/acceptance-independent/
          if-no-files-found: warn
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1, Ruby 4.0.6 support
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true
      - run: npm install --global npm@11.9.0
      - run: npm ci --ignore-scripts --engine-strict
      - name: Report documentation dependency advisories
        run: npm audit --json > npm-audit.json
      - run: npm run docs:test
      - run: npm run docs:build
      - name: Rebuild and compare every published byte
        run: |
          cp docs/_build/publication-manifest.json "$RUNNER_TEMP/accepted-docs-manifest.json"
          npm run docs:build
          cmp "$RUNNER_TEMP/accepted-docs-manifest.json" docs/_build/publication-manifest.json
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/_build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation
          path: docs/_build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: node-lock
          path: |
            package-lock.json
            npm-audit.json
  integration:
    needs: [ruby, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.9.0
      - name: Integration, documentation and container checks
        shell: bash
        run: script/check | tee verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            verification.log
            tmp/bruno-verification/
            tmp/fuzz-verification/
            tmp/acceptance-independent/
            tmp/container-verification/
            tmp/research-experiments/
  deploy-pages:
    name: Publish GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, integration]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Require the project Pages prefix
        env:
          ACTUAL_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: test "$ACTUAL_BASE_PATH/" = /paygen/
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
