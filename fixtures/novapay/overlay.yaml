overlay: 1.1.0
info:
  title: NovaPay recipient variant contract correction
  version: 1.0.0
actions:
- target: $.components.schemas.Recipient
  update:
    oneOf:
    - type: object
      properties:
        type: {enum: [sbp]}
      required: [bank_code]
      not: {required: [card_number]}
    - type: object
      properties:
        type: {enum: [card]}
      required: [card_number]
      not: {required: [bank_code]}
- target: $.components.schemas.PayoutResponse
  update:
    required:
    - id
    - external_id
    - status
    - amount
    - currency
- target: $.components.schemas.PayoutError.properties.code.enum
  remove: true
